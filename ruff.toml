# Linting UND Formatierung — mit genau einer Ausnahme statt einer Pauschale.
#
# Die Python-Dateien dieses Repos liegen unter `reference/` und sind
# Copy-Paste-Vorlagen fuer die Zielcodebasis, kein lauffaehiges Modul. Sie
# referenzieren absichtlich Namen aus der Zielumgebung (`log`, Client-Objekte,
# Settings) — ruff meldet das korrekt als F821, aber es ist hier kein Defekt,
# sondern der Zweck.
#
# Frueher stand hier `select = []`: Linting ganz aus. Gemessen kostet das zu
# viel. Ueber die 581 Zeilen unter `reference/` meldet der Ruleset unten genau
# EINEN Befund, und das ist die eine beabsichtigte F821-Stelle. Fuer eine
# einzige Regel den kompletten Linter abzuschalten heisst, jeden echten Defekt
# in Vorlagen-Code mit durchzulassen — und Vorlagen-Code ist der Code, der
# anschliessend kopiert wird. Ein Defekt hier vermehrt sich.
#
# Deshalb: voller Ruleset, F821 gezielt und begruendet unterdrueckt. Landet
# irgendwann echter Modulcode ausserhalb von `reference/`, wirkt F821 dort
# wieder — die Ausnahme haengt am Vorlagen-Pfad, nicht am Repo.
target-version = "py311"

[lint]
# E/W  pycodestyle — syntaxnahe Fehler und Zeilenlaenge.
# F    pyflakes — ungenutzte Importe, tote Namen, doppelte Argumente.
# I    isort — Importreihenfolge; in Vorlagen wichtig, weil sie beim Kopieren
#      unveraendert in fremde Dateien wandert.
# UP   pyupgrade — kein Code, der auf py311 schon veraltet ist.
# B    flake8-bugbear — echte Fehlermuster (mutable defaults, blinde `except`).
# C4   flake8-comprehensions.
# SIM  flake8-simplify.
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM"]

[lint.per-file-ignores]
# Die einzige Ausnahme. Begruendung oben: offene Namen sind in den Vorlagen
# Absicht. Diese Zeile ist die vollstaendige Liste dessen, was hier nicht
# geprueft wird — wer sie erweitert, erweitert sie sichtbar.
"reference/*.py" = ["F821"]
