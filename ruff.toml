# Ruff-Konfiguration.
#
# Kein `pyproject.toml` im Repo — der Skill ist kein Python-Paket, sondern eine
# Sammlung aus Markdown-Katalog und Werkzeugen. Deshalb steht die Konfiguration
# in einer eigenen `ruff.toml`.

# Die Test-Matrix in .github/workflows/test.yml faehrt 3.11 und 3.13.
target-version = "py311"

# Markdown bleibt aussen vor — als Entscheidung, nicht als Versehen.
#
# Bis ruff 0.15.8 war die Formatierung von Python-Bloecken in Markdown
# `preview`-only: `ruff format --check .` liess `.md` unberuehrt und meldete
# «Markdown formatting is experimental, enable preview mode», sobald man eine
# solche Datei direkt uebergab. Seit 0.16.1 ist sie stabil und standardmaessig
# an. Der Bump haette dieses Gate damit ueber Nacht auf Dokumentation
# ausgeweitet, die niemand angefasst hat — genau der Effekt, gegen den der Pin
# existiert.
#
# Gemessen beim Bump: kein einziges `.py` formatiert sich unter 0.16.1 anders,
# und `ruff check` findet nichts Neues. Betroffen waeren 82 `.md` gewesen — in
# diesem Repo also der Katalog und SKILL.md, mithin das Produkt. Die
# Aenderungen sind mechanisch (Kommentar-Ausrichtung, `2 ** x` → `2**x`,
# umbrochene asserts), aber sie greifen in Code-Beispiele ein, deren Layout
# hier stellenweise Absicht ist.
#
# Das ist kein Argument gegen Markdown-Formatierung, sondern dagegen, sie als
# Nebenwirkung eines Versions-Bumps einzufuehren. Sie zu uebernehmen ist eine
# eigene, messbare Aenderung: diese Zeile entfernen, `ruff format .` laufen
# lassen, die 82 Diffs lesen.
exclude = ["*.md"]

# Zeilenbreite: bewusst 88, und bewusst ausgeschrieben.
#
# 88 ist der ruff-Default, dieser Eintrag aendert also nichts an der
# Formatierung. Er aendert, dass die Breite eine *Entscheidung* ist statt einer
# Abwesenheit. Ohne Eintrag ist von aussen nicht unterscheidbar, ob hier jemand
# 88 gewaehlt oder nur niemand etwas eingetragen hat — und genau diese
# Ununterscheidbarkeit ist der Grund, dass die Frage ueberhaupt aufkam.
#
# Warum nicht 100, wie in 24 der 32 Portfolio-Repos (Zaehlung in SKILL.md,
# «Portfolio-Hygiene»)? Weil die dort formulierte Regel nicht «wie die
# Mehrheit» lautet, sondern **«der schmalste Wert im Portfolio schreibt den
# Code»**. Der schmalste konfigurierte Wert ist 88 (`swiss-snb-mcp`). Ein
# Angleichen nach oben wuerde die Regel nicht erfuellen, sondern brechen — und
# zwar hier, wo sie steht.
#
# Gemessen mit ruff 0.15.8 ueber den ganzen Baum. Momentaufnahme bei 60
# Dateien — der Baum waechst, die Zahlen altern, die Richtung nicht:
#
#     line-length  88 → 60 bereits formatiert
#     line-length 100 → 43 von 60 wuerden umformatiert
#     line-length 110 → 45 von 60
#     line-length 120 → 46 von 60
#
# Diese 43 Dateien enthalten Ausdruecke, die bei 88 umgebrochen sind und bei
# 100 zusammengezogen wuerden. Auf 100 zu gehen hiesse, sie auf Zeilen von bis
# zu 100 Spalten zu bringen — jede davon ist in einem 88er-Repo ein Umbruch und
# damit ein roter `ruff format --check`. Der Wechsel wuerde also genau den Bruch
# *erzeugen*, den `OPS-005` in seiner fuenften Auspraegung beschreibt, statt ihn
# zu beseitigen.
#
# Was dieser Eintrag NICHT leistet: Er macht kopierte Dateien nicht
# portfoliotauglich. Eine hier bei 88 umgebrochene Zeile will ein 100er-Repo
# zusammenziehen — der Bruch bleibt, nur in der anderen Richtung. Kopiertauglich
# ist eine Datei erst, wenn ihre *zusammengezogene* Form in 88 Spalten passt;
# nachweisbar allein durch die Schleife ueber alle genutzten Breiten aus
# `OPS-005` Modus 3. Die Konfiguration entscheidet den lokalen Boden, der Guard
# entscheidet die Kopierbarkeit. Zwei verschiedene Dinge, und nur das erste
# steht hier.
#
# UND DESHALB STEHT HIER KEIN SOLCHER GUARD. Die erste Fassung dieses
# Kommentars liess offen, ob dieses Repo ueberhaupt Dateien exportiert. Das ist
# nachgemessen worden, aus zwei unabhaengigen Richtungen:
#
#   1. Jeder dokumentierte Aufruf in `SKILL.md` und `.claude/commands/` lautet
#      `python "$SKILL_BASE/tools/…"`. Die Werkzeuge laufen im Skill-Klon, sie
#      werden nicht ins Zielrepo kopiert.
#   2. Kein Pfad schreibt eine `.py` nach draussen. Der einzige `shutil.copy`
#      im Repo (`tools/carry_forward.py`) uebertraegt Finding-*Markdown*
#      innerhalb eines Audit-Baums.
#
# Was dieses Repo tatsaechlich exportiert, sind `templates/audit-report.md` und
# `templates/finding.md` — Markdown, das kein Formatter anfasst. Ein Schritt,
# der `tools/` gegen 88/100/110/120 prueft, haette damit keinen Gegenstand: ein
# Gate, das nicht ausloesen *kann*, ist die Dekoration, vor der `OPS-005`
# selbst warnt («Gate gebaut, nie ausgeloest → falsche Sicherheit statt gar
# keiner»). Die Abwesenheit ist damit eine Entscheidung, nachpruefbar an den
# zwei Messungen oben.
#
# Aendert sich die Voraussetzung — kommt ein `scripts/`-Verzeichnis dazu, wird
# eine `.py` von hier in andere Repos kopiert —, dann faellt diese Begruendung,
# und der Schritt aus `OPS-005` Modus 3 gehoert in `.github/workflows/lint.yml`.
#
# Gebunden an SKILL.md durch tests/test_ruff_line_length.py: Der Wert hier muss
# der schmalste der dort geprueften Breiten bleiben.
line-length = 88

[lint]
# Expliziter Regelsatz, gleichgezogen mit dem uebrigen Portfolio. Ein `select`
# in der Konfiguration ersetzt die eingebauten Defaults vollstaendig; damit ist
# der erzwungene Satz exakt diese Liste, unabhaengig davon, ob eine spaetere
# ruff-Version ihre Defaults aendert.
#
#   E4 — pycodestyle: Importe (u.a. E402, Import nicht am Dateianfang)
#   E7 — pycodestyle: Anweisungen (Vergleiche, mehrere Statements pro Zeile)
#   E9 — pycodestyle: Syntax- und IO-Fehler
#   F  — Pyflakes (ungenutzte Importe und Variablen, f-String-Fehler, …)
#   I  — Import-Sortierung (isort)
#   UP — pyupgrade (moderne Syntax, z.B. `X | None`, collections.abc)
#   B  — flake8-bugbear
#   C4 — flake8-comprehensions
#   SIM— flake8-simplify
#   RUF— ruff-eigene Regeln
#
# E501 (Zeilenlaenge) bleibt bewusst aussen vor: das entscheidet der Formatter.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C4", "SIM", "RUF"]

# Die Prosa im Repo ist deutsch und nutzt bewusste Typografie — Geviert- und
# Halbgeviertstriche (—, –), Pfeile (→), typografische Anfuehrungszeichen.
# Die Ambiguous-Unicode-Regeln wuerden die als Verwechslungszeichen melden.
ignore = ["RUF001", "RUF002", "RUF003"]
