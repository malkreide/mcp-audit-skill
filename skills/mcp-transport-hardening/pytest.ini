; Konfiguration der Testsuite unter `tests/`.
;
; Getestet werden die Pruefungen dieses Repositories, nicht die Vorlagen unter
; `reference/` — die deckt die CI mit Lint, Format und einem Import-Smoke-Test
; ab, was fuer Copy-Paste-Vorlagen die passende Tiefe ist.
;
; `pythonpath = .` statt einer Installation: Es gibt kein Paket zu
; installieren, `tools/` ist Werkzeug dieses Baums.
[pytest]
testpaths = tests
pythonpath = .
addopts = -q --strict-markers
