; Konfiguration der Testsuite unter `tests/`.
;
; Getestet werden die Prüfungen dieses Repositories, nicht die Vorlagen unter
; `reference/` — die werden in Check 3 importiert, was für Vorlagen die
; passende Tiefe ist.
;
; `pythonpath = .` statt einer Installation: Es gibt kein Paket zu
; installieren, `tools/` ist Werkzeug dieses Baums.
[pytest]
testpaths = tests
pythonpath = .
addopts = -q --strict-markers
