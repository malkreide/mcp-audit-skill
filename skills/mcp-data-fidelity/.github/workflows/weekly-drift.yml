# Der Wochenplan: zwei Waechter ueber Dinge, die veralten, ohne dass hier
# jemand etwas aendert.
#
#   drift        — die Zuordnungstabelle in SKILL.md gegen den echten Katalog
#                  von mcp-audit-skill (Pruefung 14)
#   description  — die GitHub-Repo-Description gegen die Zahl der Regeln in
#                  SKILL.md (Pruefung 15)
#
# ZUM DATEINAMEN: Bis 1.8.0 hiess diese Datei `catalogue-drift.yml`, nach dem
# einzigen Waechter, den sie damals trug. Mit Pruefung 15 wurde der Name enger
# als der Inhalt, und ein Name, der nur noch die Haelfte beschreibt, schickt
# den Lesenden zur falschen Erwartung. Der Preis der Umbenennung steht dabei,
# damit ihn niemand zweimal zahlt: GitHub fuehrt Workflows unter ihrem
# DATEIPFAD, die Laeufe von `catalogue-drift.yml` haengen also weiter unter dem
# alten Eintrag und tauchen unter diesem hier nicht auf.
#
# Drei Stellen zeigen namentlich hierher und gehoeren beim naechsten Umbenennen
# mit: die Befundtexte in tools/checks/catalogue.py und
# tools/checks/repo_metadata.py — beide sagen, wo der Abruf steht, den sie
# selbst nicht machen — und der historische Verweis in tools/checks/_core.py.
# Keine Pruefung faengt einen toten Verweis darauf; das ist ein benannter Rand.
#
# ZWEI JOBS UND NICHT ZWEI SCHRITTE: Sie sind voneinander unabhaengig, und ein
# Netzaussetzer bei der einen Quelle soll die andere nicht mitnehmen. Ein roter
# Lauf soll sagen, WELCHE der beiden Aussenwelten sich bewegt hat.
#
# WARUM NICHT IM PR-LAUF. Pruefung 6 prueft, was ohne Netz pruefbar ist: dass
# jede Regel eine Zeile hat. Was sie strukturell NICHT kann, ist der
# eigentliche Fehler dieses Repos — eine Zeile, die zum Zeitpunkt des
# Schreibens stimmte und seither veraltet ist. Das ist keine Eigenschaft eines
# Commits, sondern der verstrichenen Zeit: Die Tabelle stand am 5. August
# zweimal falsch, ohne dass hier jemand etwas geaendert haette. Ein
# zeitbasierter Fehler gehoert an einen Zeitplan, nicht an einen Diff.
#
# Und er gehoert NICHT vor den Merge-Button: Ein Netzaussetzer oder ein Release
# drueben wuerde sonst einen unbeteiligten Doku-PR rot faerben. Regel 5 dieses
# Skills sagt, was dann passiert — «ein Test, der staendig falsch anschlaegt,
# wird abgeschaltet und faengt dann gar nichts mehr».
#
# MELDEWEG: Ein fehlgeschlagener Zeitplan-Lauf schickt GitHub an die Besitzerin
# des Repos. Bewusst kein Issue-Opener: Das braucht Schreibrechte und eine
# Deduplizierung, und beides ist mehr Maschinerie als die Sache traegt.

name: weekly-drift

on:
  schedule:
    # Montags 06:00 UTC. Woechentlich, weil der Katalog sich in Tagen bewegt,
    # nicht in Stunden — und weil ein taeglicher Lauf die Meldung zur Gewohnheit
    # macht, die niemand mehr liest.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # NICHT ERREICHBAR ist nicht dasselbe wie ABGEWICHEN. Beide Ausgaenge
      # sind rot, aber mit verschiedenem Text und aus verschiedenen Schritten —
      # sonst sucht man beim naechsten Netzaussetzer im Katalog nach einem
      # Fehler, den es nicht gibt.
      #
      # Der Abruf steht hier und nicht in der Pruefung: Eine Pruefung, die Netz
      # braucht, um ueberhaupt zu starten, laesst sich nicht gegen einen
      # Fixture-Baum fahren — und dann bliebe ausgerechnet die logikreichste
      # Pruefung des Repos ungetestet.
      #
      # ALLES AN EINEM COMMIT. Die Pruefung braucht zweierlei: die Liste der
      # IDs (MANIFEST.txt) und die Einstufung jedes verlinkten Checks, die im
      # Frontmatter seiner Datei steht.
      #
      # Zuerst der SHA, dann alles daran gepinnt. Zwei Abrufe von `main`
      # koennen ein Release auseinanderliegen, und der Befund beschriebe dann
      # einen Katalog, den es nie gegeben hat. Der SHA geht ausserdem in die
      # Pruefung und von dort ins Ergebnis: Ein Befund, der nicht sagt, woran
      # er gemessen hat, laesst sich spaeter nicht nachstellen.
      #
      # Geholt werden nur die VERLINKTEN Checks, nicht alle 120. Welche das
      # sind, sagt scripts/linked_checks.py — mit demselben Regex, den die
      # Pruefung benutzt. Eine zweite, hier in YAML nachgebaute Liste liefe
      # auseinander, ohne dass etwas rot wuerde.
      - name: Katalog abrufen
        env:
          REMOTE: https://github.com/malkreide/mcp-audit-skill
          RAW: https://raw.githubusercontent.com/malkreide/mcp-audit-skill
        run: |
          SHA=$(git ls-remote "$REMOTE" main | cut -f1)
          test -n "$SHA" || {
            echo "::error::NICHT ERREICHBAR (kein Drift-Befund): $REMOTE nennt keinen Commit fuer main. Wenn der Standardzweig drueben umbenannt wurde, gehoert er hier nachgezogen; die Tabelle ist damit ungeprueft, nicht falsch."
            exit 1
          }
          echo "CATALOGUE_COMMIT=$SHA" >> "$GITHUB_ENV"

          mkdir -p "$RUNNER_TEMP/checks"
          fetch() {
            curl -sS -f --retry 3 --retry-delay 5 --retry-all-errors \
                 --max-time 30 -o "$2" "$RAW/$SHA/checks/$1" || {
              echo "::error::NICHT ERREICHBAR (kein Drift-Befund): checks/$1 bei $SHA nach 3 Versuchen. Die Tabelle ist damit ungeprueft, nicht falsch."
              exit 1
            }
          }
          fetch MANIFEST.txt "$RUNNER_TEMP/checks/MANIFEST.txt"

          # Faellt dieses Skript aus, ist die Liste leer — und ein Lauf ueber
          # null Dateien meldete danach «Einstufung stimmt fuer alle 0».
          # Deshalb exitet es selbst nicht-null, wenn es nichts findet.
          LINKED=$(python scripts/linked_checks.py) || exit 1
          for ID in $LINKED; do
            fetch "$ID.md" "$RUNNER_TEMP/checks/$ID.md"
          done
          echo "ok — Katalog bei $SHA abgerufen ($(wc -l < "$RUNNER_TEMP/checks/MANIFEST.txt") IDs, $(echo "$LINKED" | wc -w) verlinkte Check-Dateien)"

      # Pruefung 14. Die Logik steht in tools/checks/catalogue.py und wird von
      # tests/ gegen Fixture-Baeume gefahren — einschliesslich des Falls, an dem
      # dieser Job bei seinem ersten Lauf falsch angeschlagen ist (eine
      # genannte, aber absichtlich nicht existierende Check-ID ist kein Befund,
      # ein toter LINK schon).
      - name: SKILL.md matches the real catalogue of mcp-audit-skill
        env:
          PYTHONUTF8: "1"
          CATALOGUE_MANIFEST: ${{ runner.temp }}/checks/MANIFEST.txt
          CATALOGUE_CHECKS_DIR: ${{ runner.temp }}/checks
          CATALOGUE_COMMIT: ${{ env.CATALOGUE_COMMIT }}
        run: python -m tools.checks --include-context-bound 14

  # Die Repo-Description ist die fuenfte Stelle, die die Zahl der Regeln nennt
  # — und die einzige, die KEIN Commit aendert. Genau deshalb kann der PR-Lauf
  # sie nicht bewachen: Er sieht die Aenderung nie und meldete «bestanden».
  # Die Begruendung steht ausfuehrlich in tools/checks/repo_metadata.py.
  description:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Wie oben: NICHT ERREICHBAR ist nicht dasselbe wie ABGEWICHEN, und der
      # Abruf steht im Workflow, damit die Pruefung selbst gegen einen
      # Fixture-Baum laufen kann.
      #
      # Mit Token, nicht anonym: Anonyme API-Aufrufe teilen sich ein Kontingent
      # pro Runner-IP. Ein Fehlschlag daraus waere ein roter Lauf ohne Befund
      # — die Sorte Meldung, die man nach dem zweiten Mal ignoriert.
      - name: Repo-Metadaten abrufen
        env:
          GH_TOKEN: ${{ github.token }}
          API: https://api.github.com/repos/${{ github.repository }}
        run: |
          curl -sS -f --retry 3 --retry-delay 5 --retry-all-errors \
               --max-time 30 \
               -H "Accept: application/vnd.github+json" \
               -H "Authorization: Bearer $GH_TOKEN" \
               -H "X-GitHub-Api-Version: 2022-11-28" \
               -o "$RUNNER_TEMP/repo.json" "$API" || {
            echo "::error::NICHT ERREICHBAR (kein Drift-Befund): $API nach 3 Versuchen. Die Description ist damit ungeprueft, nicht falsch."
            exit 1
          }
          echo "ok — Repo-Metadaten abgerufen ($(wc -c < "$RUNNER_TEMP/repo.json") Bytes)"

      # Pruefung 15. Der Befund nennt den Handgriff im Browser und keine Datei:
      # Die Description liegt in den Metadaten, kein Commit behebt sie.
      - name: The GitHub repo description names the same rule count as SKILL.md
        env:
          PYTHONUTF8: "1"
          REPO_METADATA: ${{ runner.temp }}/repo.json
        run: python -m tools.checks --include-context-bound 15
