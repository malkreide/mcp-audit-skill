# Reference-adoption manifest for mcp-data-source-probe-skill.
#
# Checked by `scripts/reference_drift_probe.py` in mcp-continuous-auditor:
#
#     python scripts/reference_drift_probe.py --target <this-repo> --repos-root ~/src
#
# WHAT THIS FILE IS. `reference/` ships code that gets copied into servers. After
# the copy the two halves drift apart in both directions and neither side looks
# wrong: in the server only the copied fragment is visible, and here there is no
# server. This file is the only place the two are named together, and the probe
# refuses to guess the mapping — a finding nobody can retrace is how a gate gets
# switched off.
#
# THE PROPERTIES ARE THE CONTRACT, NOT THE TEXT. The adopting repositories rename
# the constants, rename the function, rewrap the lines and reword the messages;
# every one of those is a correct adoption. What must survive a copy is the
# behaviour, and that is what is written down below.
#
# NOTE ON THE CURRENT STATE. The five properties below that the template did NOT
# satisfy — `reads_retry_after`, `jitters`, `caps_after_jitter`,
# `wall_clock_budget`, `no_bare_runtime_error` — are satisfied as of the
# 2026-08-07 repair. They were the 2026-08-03 finding: what the eleven surveyed
# servers had each fixed one at a time while this file kept shipping the defect.
# `REFERENCE_STALE` on any of them is now a real finding about the template, not
# the known gap it used to be. Do not delete a property to make a run green —
# repairing the template is the fix.
#
# WHAT THE ADOPTIONS BELOW DO AND DO NOT SAY. A `since` date records when that
# repository adopted the template's *behaviour*, not when it last matched this
# file. The eleven servers of the sweep reached these properties ahead of the
# template; the remaining entries were mapped by the retry-loop sweep and have
# not been re-read against the repaired version. Anyone changing a property here
# changes what every listed repository is measured against, and owes the same
# statement in the changelog: which of them have already taken it.

schema = 1

# Templates under reference/ that are deliberately not mapped. Anything else
# without a [[template]] entry is a TEMPLATE_UNMAPPED finding.
unmapped_ok = []

[unanimity]
# Facts the unanimity layer must not report. Empty on purpose: an exemption that
# is invisible is a blind spot, and there is nothing yet to exempt. The probe
# prints this list in every report.
ignore = []


# ===========================================================================
# reference/retry_backoff.py
# ===========================================================================

[[template]]
file = "reference/retry_backoff.py"
symbol = "fetch_with_retry"

# --- What the template does hold today -------------------------------------

[[template.property]]
id = "separates_status_from_network"
says = "distinguishes an HTTP status failure from a transport failure"
kind = "handles"
any_of = ["httpx.HTTPStatusError"]
expect = "present"
# The whole retry policy hangs off this split: a 4xx must fail fast and a
# connection reset must not. A server that collapses both into one handler
# retries a 404 four times and gives up on a timeout immediately.

[[template.property]]
id = "retries_transport_errors"
says = "retries network and timeout errors rather than surfacing them"
kind = "handles"
any_of = ["httpx.RequestError"]
expect = "present"

# --- The 2026-08-03 defects, repaired in the template on 2026-08-07 ---------

[[template.property]]
id = "reads_retry_after"
says = "honours the server's own Retry-After hint instead of guessing the wait"
kind = "literal"
any_of = ["retry-after"]
expect = "present"
# A header name is on the wire. It is the one string here that no adopting
# repository can rename, which is what makes it worth matching on. The template
# used to compute `base_delay * 2 ** (attempt - 1)` and never look at what the
# server asked for — on a 429 that is the wrong number by construction. It now
# reads both RFC 9110 §10.2.3 forms and falls back to the curve on an
# unparseable value; falling back must never become a crash on the error path.

[[template.property]]
id = "jitters"
says = "spreads the retry instead of synchronising every client on the same tick"
kind = "calls"
any_of = ["random.uniform", "random.random", "secrets.randbelow"]
expect = "present"
# Eleven servers behind one upstream, all retrying at exactly 2s / 4s / 8s after
# the same outage, is a thundering herd the upstream sees as a second outage.

[[template.property]]
id = "caps_after_jitter"
says = "applies the ceiling AFTER jittering, so the jitter cannot exceed it"
kind = "wraps"
outer = "min"
inner = ["random.uniform", "random.random"]
expect = "present"
# The ordering, not the presence. `min(cap, base) * jitter` and
# `min(cap, base * jitter)` both contain a cap and a jitter; only the second is
# bounded. `wraps` asks whether the jitter sits INSIDE the cap's arguments.

[[template.property]]
id = "wall_clock_budget"
says = "bounds the total time spent, not just the number of attempts"
kind = "calls"
any_of = ["time.monotonic", "time.perf_counter"]
expect = "present"
# `max_attempts = 4` bounds the retries and nothing else: four attempts against
# an upstream that takes 30s to time out is two minutes inside one tool call.
# `time.time` is deliberately not accepted — it moves when the clock is adjusted
# and a budget measured against it can run backwards.

[[template.property]]
id = "no_bare_runtime_error"
says = "fails with a typed upstream error a caller can branch on"
kind = "raises"
any_of = ["RuntimeError"]
expect = "absent"
# THE line. Half of these fixes are removals, which is why `expect` exists:
#     raise RuntimeError(f"Upstream {url} unreachable after {max_attempts} …")
# It was removed in eleven servers, one at a time, and stayed here until
# 2026-08-07. A caller cannot tell it apart from a bug in the server's own code,
# and `str(exc)` is EMPTY for httpx.ConnectTimeout, ReadTimeout and
# ConnectError — the only errors an outage actually produces — so the message
# stopped at the colon. The template now re-raises the original exception and
# keeps a named `UpstreamUnavailableError` for the one case with no original to
# re-raise: the budget spent before a single request went out.

[[template.adoption]]
repo = "malkreide/swiss-academic-libraries-mcp"
file = "src/swiss_academic_libraries_mcp/api_client.py"
symbol = "http_get_with_retry"
since = "2026-03-13"

