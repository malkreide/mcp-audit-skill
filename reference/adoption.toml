# --- Why `swiss-environment-mcp` is not in this list -----------------------
#
# It was the sixth violation of the same `ARCH-014` run and is repaired, but it
# did not adopt THIS template. Its retry lives in `sparql_client.py`, a vendored
# copy held byte-identical with `fedlex-mcp` — a sibling arrangement with its
# own contract, and the repair was to restore that identity rather than to copy
# from here.
#
# Declaring it an adoption would put one file under two mapping regimes: this
# manifest would measure it by property while the vendored-copy manifest
# measures it by bytes, and a change here would be reported as drift there. The
# two are tracked separately on purpose. `mcp-continuous-auditor` grew
# `vendored_copy_probe.py` for that side on the same day.


# ===========================================================================
# reference/response_envelope.py
# ===========================================================================

# The envelope has exactly one adoption declared so far. Extending it is the
# next round: the sweep that produced the retry mapping keyed on a retry loop,
# which says nothing about which servers copied the response model.

[[template]]
file = "reference/response_envelope.py"
# NO `symbol` — the whole module, on purpose. The vocabulary this template
# guarantees lives at module scope (`PROVENANCE_VALUES`, the ATTRIBUTION_*
# constants), not inside `ServerResponse`. Scoping to the class made the check
# below report a defect that was not there, which is the one outcome worse than
# no check.

[[template.property]]
id = "declares_provenance"
says = "every response says whether it is live, cached, dumped or stale"
kind = "literal"
any_of = ["weekly_dump", "live_api", "cached", "fallback_stale"]
expect = "present"
# The freshness contract. A consumer that cannot tell a live answer from a
# last-known-good one will treat a stale answer as current, which is the failure
# `fallback_stale` exists to make visible. `any_of` matches on ONE of the four,
# which is the honest strength: a server may legitimately not serve from a
# weekly dump, but a server with none of the four has no freshness contract.

# NOT DECLARED, and worth saying why. The other half of this template's contract
# is "the response model HAS a `source` field and a `provenance` field" — a
# statement about a class attribute. The probe's property kinds are `calls`,
# `literal`, `wraps`, `raises` and `handles`; none of them can express it, and
# `literal any_of = ["source"]` does NOT, because a field name is an identifier
# and not a string constant. Declaring it that way would put a permanent false
# finding on every correct adoption. Until the probe grows a kind for attribute
# declarations, that part of the contract is unchecked — and unchecked is what
# it is called here rather than quietly left out.

[[template.adoption]]
repo = "malkreide/swiss-efv-mcp"
file = "src/swiss_efv_mcp/models.py"
symbol = ""
since = "2026-07-25"
