# Pre-Commit-Hook — spiegelt die ruff-Schritte aus
# .github/workflows/ci.yml.
#
# Beide Schritte, nicht nur einer: `ruff-check` und `ruff-format`. Laeuft hier
# nur der Formatter, meldet der Hook gruen und die CI wird trotzdem rot — genau
# der Fall, den ein Pre-Commit-Hook verhindern soll. Ruleset und die einzige
# Ausnahme (F821 unter reference/) stehen in ruff.toml und gelten fuer beide
# Seiten, weil beide dieselbe Konfiguration lesen.
#
# Einmalig pro Clone:
#     pip install pre-commit
#     pre-commit install
#
# ACHTUNG: `rev` unten und `pip install ruff==…` in ci.yml muessen dieselbe
# Version nennen — der Schritt «Ruff-Pin-Sync» in ci.yml prueft das, und
# ebenso, dass beide Hooks unten weiterhin da sind.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.8
    hooks:
      - id: ruff-check
      - id: ruff-format
