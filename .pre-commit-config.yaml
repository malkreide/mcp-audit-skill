# Pre-Commit-Hook — spiegelt den Formatier-Schritt aus
# .github/workflows/ci.yml.
#
# Bewusst nur `ruff-format`, kein `ruff-check`: die Dateien unter `reference/`
# sind Vorlagen, deren offene Namen ruff korrekt als F821 melden wuerde. Die
# Begruendung steht in ruff.toml.
#
# Einmalig pro Clone:
#     pip install pre-commit
#     pre-commit install
#
# ACHTUNG: `rev` unten und `pip install ruff==…` in ci.yml muessen dieselbe
# Version nennen — der Schritt «Ruff-Pin-Sync» in ci.yml prueft das.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.8
    hooks:
      - id: ruff-format
