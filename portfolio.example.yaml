# portfolio.example.yaml
#
# Template für Portfolio-Audit. Kopiere nach portfolio.yaml und fülle die
# Server-Liste mit deinen MCP-Servern. portfolio.yaml ist .gitignored, damit
# Profil-Details (deployment, contexts) nicht versehentlich gepushed werden.
#
# Verwendung:
#   ./audit-portfolio.sh                 # alle Server in portfolio.yaml
#   ./audit-portfolio.sh <name>          # nur den genannten Server
#   ./audit-portfolio.sh --dry-run       # Plan ausgeben, ohne claude zu rufen
#
# `mcp_spec_version` ist seit v2.0.0 Pflicht und hat bewusst keinen Default:
# Während der Migrationswellen A–D stehen beide Protokollstände gleichzeitig im
# Portfolio, und der Wert entscheidet, welche Hälfte des Katalogs läuft. Fünf
# Checks messen einen Gegenstand, den 2026-07-28 entfernt hat (SCALE-002/003/007,
# SDK-004, SEC-009), vierzehn einen, den es davor nicht gab. Eine falsche Angabe
# tauscht die geprüfte Menge aus, ohne dass etwas rot wird — dieselbe Klasse wie
# der `transport: HTTP`-Vorfall, nur mit grösserer Reichweite.
#
# Pro Server sind name + repo + profile Pflicht. Die Profil-Werte werden
# autoritativ an /audit-mcp übergeben — Schritt 1 (Profil-Bestätigung) wird
# im Headless-Modus übersprungen.
#
# Inventar-Gate (./audit-portfolio.sh --verify-inventory):
#   Prüft, ob jedes Server-Manifest (pyproject.toml / package.json) im
#   Checkout einem Eintrag hier entspricht. Anlass war `openparldata-mcp`:
#   verschachtelt im Repo `parlament-mcp`, eigene pyproject.toml, durch
#   jede Aufzählung von Top-Level-Repos gefallen — und deshalb der letzte
#   Server im Portfolio auf dem alten SDK-Major.
#
#   Zwei optionale Felder steuern die Zuordnung:
#
#   path:    Wo das Manifest im Checkout liegt. Default ".". Ein
#            verschachtelter Server bekommt einen EIGENEN Eintrag mit
#            derselben repo-URL und seinem Pfad:
#
#              - name: openparldata-mcp
#                repo: https://github.com/malkreide/parlament-mcp
#                path: openparldata-mcp
#                profile: {...}
#
#   ignore:  Verzeichnisse, die kein Server sind (Test-Fixtures,
#            Beispiele, Tooling-Unterprojekte). Glob-Muster, relativ zum
#            Checkout. Auch global auf oberster Ebene möglich.
#
#              ignore: [examples, "tests/fixtures/*"]
#
#   Vendor-Verzeichnisse (node_modules, .venv, __pycache__, …) werden ohne
#   Deklaration übersprungen. Fixtures und Beispiele NICHT — eine
#   Heuristik, die "examples/" pauschal für harmlos hält, hätte
#   `openparldata-mcp` genauso übersehen wie die Handliste.

servers:
  - name: zurich-opendata-mcp
    repo: https://github.com/malkreide/zurich-opendata-mcp
    profile:
      transport: dual                              # stdio-only | dual | HTTP/SSE
      sdk_language: Python                         # Python | TypeScript (siehe unten)
      mcp_spec_version: "2025-11-25"                # 2025-11-25 | 2026-07-28 — wählt die Baseline
      auth_model: none                             # none | API-Key | OAuth-Proxy | OIDC
      data_class: Public Open Data                 # Public Open Data | Verwaltungsdaten | PII
      write_capable: false
      deployment: [local-stdio, Railway]           # Liste: local-stdio | Railway | Render | Kubernetes | Docker
      is_cloud_deployed: true                      # derived: true iff deployment has anything besides local-stdio
      uses_sampling: false
      uses_sequential_thinking: false
      tools_include_filesystem: false
      tools_make_external_requests: true
      stadt_zuerich_context: true
      schulamt_context: false
      volksschule_context: false
      enterprise_context: false
      data_source:
        is_swiss_open_data: true

  - name: zh-education-mcp
    repo: https://github.com/malkreide/zh-education-mcp
    profile:
      transport: stdio-only
      sdk_language: Python
      mcp_spec_version: "2026-07-28"                # dieser Server hat Welle A durchlaufen
      auth_model: API-Key
      data_class: Verwaltungsdaten
      write_capable: false
      deployment: [local-stdio]
      is_cloud_deployed: false
      uses_sampling: false
      uses_sequential_thinking: false
      tools_include_filesystem: false
      tools_make_external_requests: true
      stadt_zuerich_context: true
      schulamt_context: true
      volksschule_context: true
      enterprise_context: false
      data_source:
        is_swiss_open_data: false
