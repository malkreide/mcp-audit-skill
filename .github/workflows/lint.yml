name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Ruff gepinnt, damit ein Upstream-Release nicht den Regelsatz oder den
      # Formatter aendert und die CI an unberuehrtem Code rot wird. Bewusst
      # anheben.
      #
      # ACHTUNG: Diese Version und die `rev` in .pre-commit-config.yaml muessen
      # uebereinstimmen. Check 1 im Schritt darunter prueft das, Check 2 haelt
      # den Pin zusaetzlich gegen die ruff, die gleich wirklich laeuft.
      - run: pip install ruff==0.16.1

      # EIN KOMMANDO STATT VIER SCHRITTE.
      #
      # Die vier Gates dieses Jobs stehen jetzt als nummerierte Pruefungen
      # unter `tools/checks/`: 1 Pin-Sync, 2 laufende ruff, 3 `ruff check`,
      # 4 `ruff format --check`. Die Reihenfolge steckt in der Nummer, nicht
      # mehr in der Reihenfolge der `run:`-Zeilen — ein Lint-Befund auf einer
      # ungepinnten ruff ist wertlos.
      #
      # Und ein Lauf nennt ALLE Befunde. Vorher brach der erste rote Schritt
      # den Job ab, und die drei dahinter liefen nicht: Jeder Fehlschlag
      # kostete eine eigene Runde.
      #
      # Der Pre-Commit-Hook ruft weiterhin `tools/check_ruff_pin.py` direkt —
      # die reine Vergleichsloglik ist dort geblieben, `tools/checks/` haengt
      # sie nur ein. Eine Implementierung, zwei Einstiege.
      - name: Alle Gates (tools/checks)
        env:
          PYTHONUTF8: "1"
        run: bash scripts/validate.sh
