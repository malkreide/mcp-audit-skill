name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # SEIT 2b-iv-d BRAUCHT DIESER JOB MEHR ALS PYTEST. Die Mutationstests
      # unter `tests/suites/` fahren die Pruefungen der Companion-Suiten gegen
      # eine Kopie des Arbeitsbaums, und zwei davon haengen an der Umgebung:
      #
      #   * `probe/3` importiert die Vorlagen WIRKLICH — `pydantic`, `httpx`.
      #   * `transport/6` ruft `ruff` fuer die F821-Liste, gepinnt wie in
      #     `lint.yml`, damit hier keine andere Version misst als dort.
      #
      # Beide melden ohne ihre Abhaengigkeit einen BEFUND und ueberspringen
      # nicht — «nicht gelaufen» als «bestanden» zu melden ist die eine
      # Auskunft, die schlimmer ist als keine. Genau deshalb faellt der Job
      # auf, wenn diese Zeilen fehlen, statt still weniger zu pruefen.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml ruff==0.16.3
          pip install -r requirements-reference.txt

      - name: Run pytest (UTF-8 forced)
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: python -m pytest tests/ -v

      - name: Smoke test catalog evaluator
        env:
          PYTHONUTF8: "1"
        run: python tools/eval_applicability.py catalog portfolio.example.yaml --format table
