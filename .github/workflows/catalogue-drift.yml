# Katalog-Drift: haelt die Zuordnungstabelle in SKILL.md gegen den echten
# Katalog von mcp-audit-skill.
#
# WARUM NICHT IM PR-LAUF. Der Wächter in ci.yml prueft, was ohne Netz pruefbar
# ist: dass jede Regel eine Zeile hat. Was er strukturell NICHT kann, ist der
# eigentliche Fehler dieses Repos — eine Zeile, die zum Zeitpunkt des Schreibens
# stimmte und seither veraltet ist. Das ist keine Eigenschaft eines Commits,
# sondern der verstrichenen Zeit: Die Tabelle stand am 5. August zweimal falsch,
# ohne dass hier jemand etwas geaendert haette. Ein zeitbasierter Fehler gehoert
# an einen Zeitplan, nicht an einen Diff.
#
# Und er gehoert NICHT vor den Merge-Button: Ein Netzaussetzer oder ein Release
# drueben wuerde sonst einen unbeteiligten Doku-PR rot faerben. Regel 5 dieses
# Skills sagt, was dann passiert — «ein Test, der staendig falsch anschlaegt,
# wird abgeschaltet und faengt dann gar nichts mehr».
#
# MELDEWEG: Ein fehlgeschlagener Zeitplan-Lauf schickt GitHub an die Besitzerin
# des Repos. Bewusst kein Issue-Opener: Das braucht Schreibrechte und eine
# Deduplizierung, und beides ist mehr Maschinerie als die Sache traegt.

name: catalogue-drift

on:
  schedule:
    # Montags 06:00 UTC. Woechentlich, weil der Katalog sich in Tagen bewegt,
    # nicht in Stunden — und weil ein taeglicher Lauf die Meldung zur Gewohnheit
    # macht, die niemand mehr liest.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: SKILL.md matches the real catalogue of mcp-audit-skill
        env:
          PYTHONUTF8: "1"
        run: |
          python - <<'PY'
          import pathlib, re, sys, time, urllib.error, urllib.request

          MANIFEST = ("https://raw.githubusercontent.com/malkreide/"
                      "mcp-audit-skill/main/checks/MANIFEST.txt")
          HEADING = "### Welche Regel welcher Check ist"
          WORDS = {"fünf": 5, "sechs": 6, "sieben": 7, "acht": 8, "neun": 9,
                   "zehn": 10, "elf": 11, "zwölf": 12, "dreizehn": 13}

          # Nicht erreichbar ist NICHT dasselbe wie abgewichen. Beide Ausgaenge
          # sind rot, aber mit verschiedenem Text — sonst sucht man beim
          # naechsten Netzaussetzer im Katalog nach einem Fehler, den es nicht
          # gibt.
          for attempt in range(3):
              try:
                  with urllib.request.urlopen(MANIFEST, timeout=30) as resp:
                      raw = resp.read().decode("utf-8")
                  break
              except (urllib.error.URLError, TimeoutError) as exc:
                  if attempt == 2:
                      sys.exit(f"NICHT ERREICHBAR (kein Drift-Befund): {MANIFEST} "
                               f"nach 3 Versuchen — {exc}. Wenn die Datei drueben "
                               "umgezogen ist, gehoert die URL hier nachgezogen; "
                               "die Tabelle ist damit ungeprueft, nicht falsch.")
                  time.sleep(5 * (attempt + 1))

          ids = [ln.strip() for ln in raw.splitlines() if ln.strip()]
          if not ids or not all(re.fullmatch(r"[A-Z]{2,6}-\d{3}", i) for i in ids):
              sys.exit("MANIFEST.txt sieht nicht aus wie eine Liste von Check-IDs "
                       "— Format drueben geaendert, dieser Job prueft sonst nichts")
          catalogue = set(ids)
          categories = {i.split("-")[0] for i in ids}
          fid = {i for i in ids if i.startswith("FID-")}

          skill = pathlib.Path("SKILL.md").read_text(encoding="utf-8")
          m = re.search(rf"^{re.escape(HEADING)}\n(.*?)(?=^#{{2,3}} |\Z)",
                        skill, re.M | re.S)
          if not m:
              sys.exit(f"SKILL.md: section {HEADING!r} not found — anchor gone, so "
                       "this job would silently stop checking")
          section = m.group(1)

          problems = []

          # 1) Die Zahlen in der Kopfzeile.
          head = re.search(
              r"(?P<total>\d+) Checks in (?P<cats>\w+) Kategorien.*?"
              r"davon (?P<fid>\w+) in der Kategorie `FID`",
              section, re.S)
          if not head:
              sys.exit("SKILL.md: the catalogue-state sentence no longer matches "
                       "'<N> Checks in <wort> Kategorien ... davon <wort> in der "
                       "Kategorie `FID`' — reworded, so the numbers went unchecked")
          claimed_total = int(head.group("total"))
          claimed_cats = WORDS.get(head.group("cats"))
          claimed_fid = WORDS.get(head.group("fid"))
          if claimed_total != len(catalogue):
              problems.append(f"Katalog-Groesse: Tabelle sagt {claimed_total}, "
                              f"MANIFEST.txt hat {len(catalogue)}")
          if claimed_cats != len(categories):
              problems.append(f"Kategorien: Tabelle sagt {head.group('cats')!r} "
                              f"({claimed_cats}), MANIFEST.txt hat "
                              f"{len(categories)} ({sorted(categories)})")
          if claimed_fid != len(fid):
              problems.append(f"FID-Checks: Tabelle sagt {head.group('fid')!r} "
                              f"({claimed_fid}), MANIFEST.txt hat {len(fid)} "
                              f"({sorted(fid)})")

          # 2) Jeder VERLINKTE Check muss existieren — und nur der.
          #
          # Bewusst nicht jede genannte ID: Der erste Lauf dieses Jobs ist genau
          # daran falsch angeschlagen. Die Tabelle nennt ein `FID-007`, das es
          # absichtlich nicht gibt («statt ein `FID-007` zu eroeffnen»), und ein
          # Wächter, der eine korrekte Gegenrede als Fehler meldet, ist der
          # Fehlalarm aus Regel 5. Ein toter *Link* dagegen ist immer ein Befund.
          linked = set(re.findall(r"/checks/([A-Z]{2,6}-\d{3})\.md", section))
          gone = sorted(linked - catalogue)
          if gone:
              problems.append(f"Die Tabelle verlinkt {gone}, im Katalog gibt es "
                              "sie nicht (mehr) — umbenannt, zurueckgezogen oder "
                              "Tippfehler in der URL")

          # 3) Ein FID-Check, den die Tabelle nicht VERLINKT, ist der Fall vom
          #    5. August: Genau so ist `FID-006` entstanden, waehrend hier «kein
          #    Check» stand. Auch hier zaehlt der Link und nicht die Erwaehnung —
          #    und zwar in dieselbe Richtung nuetzlich: Gaebe es eines Tages ein
          #    echtes `FID-007`, schlaegt dieser Punkt an, obwohl die ID im Text
          #    vorkommt. Das ist richtig so, denn der Satz, der sie heute nennt
          #    («statt ein `FID-007` zu eroeffnen»), waere an diesem Tag falsch.
          unlinked = sorted(fid - linked)
          if unlinked:
              problems.append(f"Neu im Katalog und in der Tabelle nicht verlinkt: "
                              f"{unlinked} — welche Regel deckt er ab?")

          if problems:
              print("DRIFT — die Zuordnungstabelle in SKILL.md ist gegenueber dem "
                    "Katalog veraltet:\n")
              for p in problems:
                  print(f"  - {p}")
              print("\nQuelle ist die Check-Datei drueben, nicht deren CHANGELOG.")
              sys.exit(1)

          print(f"ok — {claimed_total} Checks, {claimed_cats} Kategorien, "
                f"{claimed_fid} in FID; alle {len(linked)} verlinkten Checks "
                "existieren, alle FID-Checks sind verlinkt")
          PY
