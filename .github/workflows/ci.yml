name: validate

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python references are syntactically valid
        run: |
          if [ -d reference ]; then
            python -m compileall -q reference/
            echo "ok — reference/ compiles"
          else
            echo "skipped — no reference/ directory yet"
          fi

      # Nur Formatierung, kein `ruff check` — Begruendung in ruff.toml.
      # Ruff gepinnt, damit ein Upstream-Release den Formatter nicht aendert
      # und die CI an unberuehrtem Vorlagen-Code rot wird. Bewusst anheben.
      #
      # ACHTUNG: diese Version und die `rev` in .pre-commit-config.yaml
      # muessen uebereinstimmen — der Schritt darunter prueft es.
      #
      # Der Schritt darunter vergleicht dabei ZWEI TEXTE. Ob die ruff, die
      # gleich `ruff format --check` faehrt, diese Version traegt, sagt er
      # nicht — dafuer gibt es den Schritt «Ruff-Version» weiter unten.
      - name: Ruff installieren
        run: pip install ruff==0.16.1

      - name: Formatierung der Referenz-Vorlagen
        run: ruff format --check .

      # Der Ruff-Pin steht zweimal: oben und als `rev` im Pre-Commit-Hook.
      # Laufen sie auseinander, formatiert der Hook nach der einen und dieser
      # Job prueft nach der anderen Version — der Hook meldet gruen und die CI
      # wird rot. Ein fehlender Pin ist ebenfalls ein Fehler: dann hat der
      # Vergleich nicht stattgefunden.
      #
      # Reine Shell statt eines Python-Skripts: in einem Repo, dessen einziger
      # Python-Code Vorlagen sind, waere ein eigenes Modul samt Tests
      # unverhaeltnismaessig.
      - name: Ruff-Pin-Sync (ci.yml ↔ .pre-commit-config.yaml)
        run: |
          ci=$(sed -n 's/.*ruff==\([0-9][^ "'"'"']*\).*/\1/p' .github/workflows/ci.yml | head -1)
          hook=$(sed -n '/ruff-pre-commit/,/hooks:/{s/^[[:space:]]*rev:[[:space:]]*v\{0,1\}\([0-9][^[:space:]]*\)[[:space:]]*$/\1/p;}' .pre-commit-config.yaml | head -1)
          if [ -z "$ci" ]; then
            echo "::error::.github/workflows/ci.yml nennt kein ruff==<version>."; exit 1
          fi
          if [ -z "$hook" ]; then
            echo "::error::.pre-commit-config.yaml nennt keine rev fuer ruff-pre-commit."; exit 1
          fi
          if [ "$ci" != "$hook" ]; then
            echo "::error::Ruff-Pins laufen auseinander — ci.yml $ci, Hook $hook. Beide im selben Commit bumpen."; exit 1
          fi
          echo "Ruff-Pin OK ($ci; beide DATEIEN stimmen ueberein)."

      # Der Schritt darueber vergleicht zwei TEXTE. Er belegt, dass ci.yml und
      # der Hook dieselbe Zahl nennen — nicht, dass die ruff, die den Schritt
      # «Formatierung der Referenz-Vorlagen» gefahren hat, diese Zahl traegt.
      # Liegt eine andere ruff weiter vorne im PATH als die gerade
      # installierte, meldet er weiter «beide Stellen stimmen ueberein», und
      # das einzige Gate dieses Repos laeuft daneben auf einer Version, die
      # niemand gepinnt hat.
      #
      # Fuer dieses Repo ist das nicht theoretisch, und ruff.toml sagt warum:
      # Bis 0.15.8 liess `ruff format --check .` Markdown unberuehrt, seit
      # 0.16.1 ist die Formatierung von Python-Bloecken in Markdown stabil und
      # standardmaessig an. Genau der Unterschied, gegen den der Pin existiert
      # — und ohne diesen Schritt haette der Pin ihn nur behauptet.
      #
      # Gemessen im Schwester-Repo mcp-data-source-probe-skill (Check 18):
      # ruff 0.15.8 vor 0.16.1 im PATH, der Pin-Sync gruen, das Gate auf der
      # falschen Version. 0.15.8 ist kein ausgedachter Wert — es ist die
      # Version, die das Portfolio sonst fuehrt.
      #
      # Reine Shell, aus demselben Grund wie der Schritt darueber: in einem
      # Repo, dessen einziger Python-Code Vorlagen sind, waere ein eigenes
      # Modul samt Tests unverhaeltnismaessig.
      #
      # Ein fehlender Pin und eine unlesbare Antwort sind FEHLER, kein Grund
      # zum Ueberspringen: Dann hat der Vergleich nicht stattgefunden, und
      # «nicht gelaufen» als «bestanden» zu melden ist die eine Auskunft, die
      # schlimmer ist als keine.
      - name: Ruff-Version (Pin ↔ laufendes Programm)
        run: |
          ci=$(sed -n 's/.*ruff==\([0-9][^ "'"'"']*\).*/\1/p' .github/workflows/ci.yml | head -1)
          if [ -z "$ci" ]; then
            echo "::error::.github/workflows/ci.yml nennt kein ruff==<version> — Anker weg. Ohne ihn hat dieser Schritt nichts, wogegen er die laufende ruff haelt, und haette genau deshalb Erfolg gemeldet."; exit 1
          fi
          if ! command -v ruff >/dev/null 2>&1; then
            echo "::error::ruff liegt nicht auf dem PATH — die laufende Version laesst sich nicht ermitteln. FAIL statt skip: ein uebersprungener Schritt meldete «bestanden», wo «nicht gelaufen» richtig waere."; exit 1
          fi
          # Die Ausgabeform «ruff 0.16.1» ist selbst ein Anker. Aendert
          # upstream sie, darf dieser Schritt nicht stillschweigend nichts
          # mehr vergleichen — er sagt dann, dass er die Antwort nicht lesen
          # konnte.
          raw=$(ruff --version 2>&1) || {
            echo "::error::\`ruff --version\` endete mit einem Fehler: $raw"; exit 1
          }
          running=$(printf '%s\n' "$raw" | sed -n 's/^ruff[[:space:]]\{1,\}\([0-9][^[:space:]]*\).*/\1/p' | head -1)
          if [ -z "$running" ]; then
            echo "::error::\`ruff --version\` antwortet nicht in der Form 'ruff <version>' — gelesen wurde: $raw. Hat upstream die Ausgabe geaendert, gehoert das sed oben nachgezogen; ohne das vergliche dieser Schritt nichts mehr und meldete es nicht."; exit 1
          fi
          if [ "$running" != "$ci" ]; then
            echo "::error::Die ruff auf dem PATH ist $running, gepinnt ist $ci ($(command -v ruff)). Das Format-Gate laeuft dann auf einer anderen Version als der gepinnten. Beide Richtungen kosten: eine aeltere laesst durch, was spaeter rot wird; eine neuere beanstandet, was der Pin durchlaesst. Der Pin-Sync merkt es nicht — er vergleicht zwei Texte miteinander, nicht den Text mit dem laufenden Programm."; exit 1
          fi
          echo "Ruff-Version OK ($running auf dem PATH, wie in ci.yml gepinnt)."

      # Bis hierher war `reference/patterns.py` die groesste ungeprueft
      # gebliebene Python-Datei der Kette: `compileall` sagt «Syntax ok»,
      # `ruff format --check` sagt «Layout ok». Was keiner von beiden sagt, ist
      # ob ein Import ungenutzt ist, ein Name doppelt gebunden wird oder ein
      # Vergleich `is` gegen ein Literal stellt. In einer Copy-Paste-Vorlage
      # wandert jeder dieser Defekte in fremde Codebasen weiter — die Datei ist
      # zugleich die ungeprueftste und die, die Leute kopieren.
      #
      # DIESER SCHRITT STEHT NACH DEM VERSIONS-SCHRITT, nicht davor: erst dort
      # ist belegt, dass die ruff auf dem PATH die gepinnte ist. Ein Lint-Gate
      # auf einer ungepinnten ruff meldet ein Ergebnis, das niemand reproduziert.
      #
      # `--extend-select`, nicht `ruff check .`: ruff.toml fuehrt `select = []`,
      # und zwar bewusst — ein `ruff check` im Clone soll auf Vorlagen-Code
      # keine Fehlalarme werfen (Begruendung dort). Ohne die Flags liest dieser
      # Schritt genau dieses `select = []` und meldet «All checks passed», ohne
      # eine einzige Regel geprueft zu haben. Gemessen, weil es der Fehler ist,
      # der hier am leichtesten passiert: `ruff check reference/` ist an diesem
      # Baum gruen — und waere es auch an einem kaputten. Ein Gate, das nichts
      # prueft und gruen meldet, ist schlimmer als keines (OPS-005).
      #
      # Der Regelsatz steht ausdruecklich da, statt sich auf ruffs Default zu
      # verlassen: Der Default ist selbst etwas, das ein Upstream-Release
      # verschiebt, und dann prueft dieses Gate ueber Nacht etwas anderes als
      # gestern, ohne dass jemand die Datei angefasst hat. Derselbe Grund wie
      # beim Pin eine Ebene hoeher.
      #
      # `line-length` und `target-version` kommen weiterhin AUS ruff.toml — die
      # Flags oben erweitern nur die Regelauswahl. Das ist Absicht: eine zweite
      # Zahl in dieser Datei waere eine zweite Stelle, die auseinanderlaufen
      # kann, und fuer genau diesen Fall faehrt dieses Repo schon einen eigenen
      # Sync-Check. Dass ruff.toml hier wirklich gelesen wird, ist nachgemessen
      # und nicht bloss angenommen: mit `--extend-select E501` ist der Baum bei
      # `line-length = 88` rot (3 Treffer) und bei 200 gruen.
      #
      # F821 ist die eine Ausnahme, und sie ist der Grund fuer `select = []`:
      # die Vorlagen referenzieren absichtlich Namen aus der Zielumgebung
      # (`get_settings`, `mcp`, `AuthError`, die Settings-Felder). Gemessen: 31
      # Treffer, alle beabsichtigt.
      #
      # DER PREIS DAVON GEHOERT HIERHER, nicht in eine Fussnote: Ein echter
      # Tippfehler in einem solchen offenen Namen — `sttings.host` statt
      # `settings.host` — faellt unter dieser Ausnahme ebenfalls nicht auf.
      # Dieses Gate faengt alles ANDERE. Wer die Luecke schliessen will,
      # braucht eine Positivliste der erwarteten offenen Namen; das ist eine
      # eigene, groessere Aenderung und keine Flagge mehr.
      #
      # E501 bleibt draussen: Zeilenlaenge gehoert dem Formatter, und E501
      # feuert genau auf das, was `ruff format` NICHT umbrechen kann (lange
      # Strings, URLs in Kommentaren). Gemessen: 3 Treffer, alle dieser Art.
      # Sie mitzunehmen hiesse, erklaerenden Vorlagentext umzubrechen, damit
      # ein Gate gruen wird — der Schwanz wedelt mit dem Hund.
      - name: Lint der Referenz-Vorlagen
        run: |
          ruff check --extend-select E4,E7,E9,F --ignore F821 reference/
          echo "ok — reference/ lint-sauber (E4,E7,E9,F ohne F821)"

      # Der Import-Smoke-Test braucht die Pakete, die `reference/patterns.py`
      # oben importiert. `starlette` und `uvicorn` kommen als Abhaengigkeiten
      # von `mcp` mit und stehen deshalb nicht einzeln hier — sie einzeln zu
      # pinnen hiesse, das Aufloesungsergebnis des SDK zu ueberstimmen.
      #
      # `mcp` ist exakt gepinnt, und dieser Pin ist der tragende: Die Vorlage
      # beschreibt die Oberflaeche von SDK 2.x (`mcp.server.mcpserver.MCPServer`,
      # `mcp.server.transport_security`). Was der Schritt darunter prueft, ist
      # die Vorlage gegen GENAU DIESE Version.
      #
      # Was er damit NICHT prueft, gehoert dazugesagt: Er merkt nicht, wenn
      # upstream die Oberflaeche in 2.1 verschiebt — dann bleibt er gruen und
      # die Vorlage veraltet still. Diesen Pin zu heben ist die Handlung, die
      # das misst, und sie gehoert bewusst gemacht, nicht von einem Resolver
      # nebenbei. Umgekehrt gilt der Grund vom ruff-Pin genauso: ungepinnt
      # faerbt ein fremdes Release die CI an unberuehrtem Vorlagen-Code rot.
      - name: Vorlagen-Abhaengigkeiten installieren
        run: pip install mcp==2.0.0 pytest==9.1.1

      # `compileall` beweist, dass die Datei PARST. Das ist weniger, als es
      # klingt: Ein Import auf ein Modul, das es nicht mehr gibt, ein Dekorator,
      # der beim Auswerten wirft, ein Tippfehler in einem Namen auf Modulebene —
      # alles das parst einwandfrei und faellt erst beim Importieren auf.
      #
      # Genau hier ist das keine Theorie, sondern der Zweck: Die Vorlage
      # importiert `from mcp.server.mcpserver import MCPServer` und
      # `from mcp.server.transport_security import TransportSecuritySettings`.
      # Das sind die zwei Zeilen, um die es in Regel 1 geht — die 1.x-Fassung
      # (`mcp.server.fastmcp`) existiert in 2.0.0 nachweislich nicht mehr.
      # Dieser Schritt ist damit der einzige im Job, der die Vorlage gegen die
      # ECHTE SDK-Oberflaeche haelt statt gegen ihren eigenen Text.
      #
      # `PYTHONPATH=reference` statt eines Pakets: `reference/` ist bewusst
      # kein Modulbaum (kein `__init__.py`), sondern eine Sammlung von
      # Vorlagen. Das hier aendert daran nichts und braucht keine neue Datei.
      #
      # Kein Skip, wenn der Import scheitert — derselbe Grund wie ueberall in
      # dieser Datei: «nicht gelaufen» als «bestanden» zu melden ist die eine
      # Auskunft, die schlimmer ist als keine.
      - name: reference/patterns.py laesst sich importieren
        env:
          PYTHONPATH: reference
          PYTHONUTF8: "1"
        run: |
          python -c "import patterns; print('ok — reference/patterns.py importiert, SDK-Oberflaeche aufgeloest')"

      - name: SKILL.md carries a well-formed frontmatter
        env:
          PYTHONUTF8: "1"
        run: |
          python - <<'PY'
          import pathlib, re, sys
          p = pathlib.Path("SKILL.md")
          m = re.match(r"^---\nname: (.+?)\ndescription: (.+?)\n---\n",
                       p.read_text(encoding="utf-8"), re.S)
          if not m:
              sys.exit("SKILL.md: frontmatter missing or malformed")
          name, desc = m.group(1).strip(), m.group(2).strip()
          if name != "mcp-transport-hardening":
              sys.exit(f"SKILL.md: expected name 'mcp-transport-hardening', got {name!r}")
          if len(desc) > 1024:
              sys.exit(f"SKILL.md: description too long ({len(desc)} > 1024)")
          print(f"ok — name={name}, description={len(desc)} chars")
          PY

      - name: Every rule carries a counter-example pair and a Nachweis
        env:
          PYTHONUTF8: "1"
        run: |
          python - <<'PY'
          import pathlib, re, sys

          skill = pathlib.Path("SKILL.md").read_text(encoding="utf-8")
          sections = re.split(r"^## (?=Regel )", skill, flags=re.M)[1:]
          if not sections:
              sys.exit("SKILL.md: no '## Regel N' sections found")

          numbers = [int(re.match(r"Regel (\d+)", s).group(1)) for s in sections]
          if numbers != list(range(1, len(numbers) + 1)):
              sys.exit(f"SKILL.md: rule numbers not sequential: {numbers}")

          for section in sections:
              title = section.splitlines()[0]
              body = section.split("\n## ")[0]
              if "# ✗" not in body or "# ✓" not in body:
                  sys.exit(f"{title}: missing the counter-example / example code pair")
              if "**Nachweis:**" not in body:
                  sys.exit(f"{title}: missing the Nachweis sentence")
              print(f"ok — {title[:60]}")
          print(f"ok — {len(sections)} rules, each with a code pair and a Nachweis")
          PY

      - name: Rule count is consistent across SKILL.md, both READMEs and patterns.py
        env:
          PYTHONUTF8: "1"
        run: |
          python - <<'PY'
          import pathlib, re, sys

          skill = pathlib.Path("SKILL.md").read_text(encoding="utf-8")
          expected = len(re.findall(r"^## Regel \d+", skill, re.M))

          def listed(path, heading):
              text = pathlib.Path(path).read_text(encoding="utf-8")
              m = re.search(rf"^## {heading}\n(.*?)(?=^## )", text, re.M | re.S)
              if not m:
                  sys.exit(f"{path}: section '## {heading}' not found")
              return len(re.findall(r"^\d+\. ", m.group(1), re.M))

          for path, heading in [("README.md", "The fourteen rules"),
                                ("README.de.md", "Die vierzehn Regeln")]:
              got = listed(path, heading)
              if got != expected:
                  sys.exit(f"{path}: lists {got} rules, SKILL.md defines {expected}")
              print(f"ok — {path}: {got} rules")

          # reference/patterns.py makes two claims nothing else checks: the number
          # word in its module docstring, and that every rule actually appears in
          # it. Both were correct when written — which is exactly how a sibling
          # repository went on describing "five rules" for two weeks after the
          # sixth was added.
          # Bis "fifteen", damit die naechsten Regeln den Wortschatz nicht
          # sprengen: ein Zahlwort, das hier fehlt, ergibt `None` und meldet
          # dieselbe Meldung wie ein echter Zahlendreher — der Befund zeigte
          # dann auf die falsche Datei.
          WORDS = {"one": 1, "two": 2, "three": 3, "four": 4, "five": 5,
                   "six": 6, "seven": 7, "eight": 8, "nine": 9, "ten": 10,
                   "eleven": 11, "twelve": 12, "thirteen": 13, "fourteen": 14,
                   "fifteen": 15}
          patterns = pathlib.Path("reference/patterns.py").read_text(encoding="utf-8")

          m = re.search(r"patterns for the (?P<word>\w+) [\w-]+ rules", patterns)
          if not m:
              sys.exit("reference/patterns.py: the phrase 'patterns for the <word> "
                       "... rules' is gone — anchor removed or reworded, so this "
                       "check would silently stop checking")
          if m.group("word") not in WORDS:
              sys.exit(f"reference/patterns.py: docstring says "
                       f"{m.group('word')!r}, which is not a number word this "
                       "check knows — extend WORDS in ci.yml, otherwise the "
                       "comparison below reports a mismatch that is really a "
                       "gap in this script")
          claimed = WORDS[m.group("word")]
          if claimed != expected:
              sys.exit(f"reference/patterns.py: docstring says {m.group('word')!r} "
                       f"rules, SKILL.md defines {expected}")

          # «Rule 4», «Rules 2 + 3», «Rules 5-7», «rule 1(c)».
          #
          # Nur EINZELNE Nennungen zaehlen als Abdeckung. Eine Sammelueberschrift
          # wie «Rules 8-12» benennt einen Abschnitt; sie belegt nicht, dass es
          # fuer Regel 12 ein Muster gibt, das jemand kopieren koennte. Dieser
          # Check expandierte frueher Bereiche, und ein Mutationstest hat gezeigt,
          # was das kostet: Den ganzen Regel-13-Block zu loeschen liess die Datei
          # gruen, weil die Abschnittsueberschrift darueber die 13 mitzaehlte.
          # Bereiche werden weiterhin expandiert — aber nur fuer die Zeile, die
          # ausgegeben wird, nicht fuer das Urteil.
          mentioned, singular = set(), set()
          for mm in re.finditer(r"[Rr]ules?\s+(\d+(?:\s*(?:[-–+,]|and)\s*\d+)*)", patterns):
              nums = [int(n) for n in re.findall(r"\d+", mm.group(1))]
              if len(nums) == 1:
                  singular.update(nums)
              if re.search(r"[-–]", mm.group(1)) and len(nums) == 2:
                  mentioned.update(range(nums[0], nums[1] + 1))
              else:
                  mentioned.update(nums)
          missing = sorted(set(range(1, expected + 1)) - singular)
          if missing:
              sys.exit(f"reference/patterns.py: nothing for rule(s) {missing} — "
                       "a rule without a pattern is a rule nobody can copy. A "
                       "collective «Rules N-M» heading does not count; the rule "
                       "needs a block that names it on its own")
          print(f"ok — reference/patterns.py: says {m.group('word')}, covers "
                f"{sorted(mentioned)}, each named singly")

          print(f"ok — {expected} rules, consistent everywhere")
          PY

      - name: Referenced files exist
        run: |
          for f in SKILL.md reference/patterns.py README.md README.de.md \
                   LICENSE CHANGELOG.md; do
            test -f "$f" || { echo "missing: $f"; exit 1; }
          done
          echo "ok — all referenced files present"

      # The five repositories of the chain are named together in exactly one
      # place per language. Nothing outside this repo can be tested from here —
      # the GitHub topic itself is checked by the guard in mcp-audit-skill,
      # which is the only repo carrying the manifest. What CAN be tested is
      # that the table has not quietly lost a member.
      - name: The quality-chain table names all five members
        env:
          PYTHONUTF8: "1"
        run: |
          python - <<'PY'
          import pathlib, re, sys

          MEMBERS = [
              "mcp-data-source-probe-skill",
              "mcp-data-fidelity-skill",
              "mcp-transport-hardening-skill",
              "mcp-audit-skill",
              "mcp-continuous-auditor",
          ]
          TOPIC_URL = "https://github.com/topics/mcp-quality-chain"

          for path, heading in [("README.md", "The MCP quality chain"),
                                ("README.de.md", "Die MCP-Qualitätskette")]:
              text = pathlib.Path(path).read_text(encoding="utf-8")
              m = re.search(rf"^### {re.escape(heading)}\n(.*?)(?=^#{{2,3}} |\Z)",
                            text, re.M | re.S)
              if not m:
                  sys.exit(f"{path}: section '### {heading}' not found — anchor gone "
                           "or reworded, so this check would silently stop checking")
              body = m.group(1)
              missing = [r for r in MEMBERS if r not in body]
              if missing:
                  sys.exit(f"{path}: the chain table does not name {missing}")
              if TOPIC_URL not in body:
                  sys.exit(f"{path}: the shared topic page {TOPIC_URL} is not linked — "
                           "without it the table is a list nobody outside can find")
              print(f"ok — {path}: all {len(MEMBERS)} members named, topic page linked")
          PY

      - name: No compiled Python is tracked
        run: |
          if git ls-files | grep -E '(__pycache__/|\.py[cod]$)'; then
            echo "compiled Python is tracked — see .gitignore"
            exit 1
          fi
          echo "ok — no compiled Python tracked"

      - name: Version badge matches the latest CHANGELOG release
        env:
          PYTHONUTF8: "1"
        run: |
          python - <<'PY'
          import pathlib, re, sys

          # Quelle ist die oberste Release-Überschrift. `[Unreleased]` trägt keine
          # Versionsnummer und wird vom Muster von selbst übersprungen.
          lines = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          HEADING = re.compile(r"^## \[v?(?P<version>\d+\.\d+\.\d+)\]")
          source = next(((n, ln, m.group("version"))
                         for n, ln in enumerate(lines, 1)
                         if (m := HEADING.match(ln))), None)
          if source is None:
              sys.exit("CHANGELOG.md: no '## [X.Y.Z]' release heading found — anchor "
                       "gone, so this check would have nothing to compare against")
          lineno, heading, expected = source

          # Über das Dateisystem, nicht als gepflegte Liste: eine dritte
          # Sprachfassung ist damit automatisch abgedeckt.
          readmes = sorted(pathlib.Path(".").glob("README*.md"))
          if not readmes:
              sys.exit("no README*.md found — nothing to check, which would pass silently")

          BADGE = re.compile(r"badge/version-(\d+\.\d+\.\d+)-")
          for path in readmes:
              found = BADGE.findall(path.read_text(encoding="utf-8"))
              if not found:
                  sys.exit(f"{path}: no version badge found — anchor gone or reworded, "
                           "so this check would stop checking this file")
              stale = sorted({v for v in found if v != expected})
              if stale:
                  sys.exit(
                      f"{path}: version badge shows {stale}, but the topmost release in "
                      f"CHANGELOG.md is {expected} (line {lineno}: {heading.strip()!r}).\n"
                      "  Either the badge was not bumped with the release, or a release "
                      "heading was lost — check which side moved before editing."
                  )
              print(f"ok — {path}: {expected}")
          print(f"ok — version badge matches CHANGELOG ({expected}, line {lineno}) "
                f"in {len(readmes)} file(s)")
          PY

      # DIESER SCHRITT STEHT ABSICHTLICH ALS LETZTER.
      #
      # Er ist der einzige, den kein Commit gruen machen kann: Die Description
      # liegt ausserhalb des Repos, also behebt sie nur ein Mensch mit
      # `gh repo edit`. Stand er weiter oben, brach er den Job ab und die vier
      # Schritte dahinter liefen NICHT — gemessen am ersten Lauf, der ihn
      # ausloeste (PR #13, vierzehn Regeln gegen «thirteen» in der Description).
      # Das ist OPS-005 an der eigenen Pipeline: Ein uebersprungener Schritt
      # sieht im Job-Log aus wie einer, der nicht dran war, und ein roter
      # Badge-Check waere hinter dem roten Description-Check unsichtbar
      # geblieben. Ein Guard, der nur von aussen zu befriedigen ist, darf die
      # Guards nicht verdecken, die ein Commit befriedigt.
      #
      # Die GitHub-Description steht ausserhalb des Repos und faellt damit durch
      # jede Pruefung, die Dateien liest. Genau dort ist die Regelzahl zuletzt
      # haengengeblieben: «twelve», als SKILL.md schon dreizehn fuehrte. Das ist
      # Regel 13 raeumlich statt zeitlich — die Abdeckung hatte eine Grenze, die
      # niemand absichtlich gezogen hat, und ausserhalb davon wurde nichts rot.
      #
      # Kein zweiter WORDS-Wortschatz: Verglichen wird gegen das Zahlwort aus
      # dem Docstring von reference/patterns.py, und der Schritt darueber hat
      # bereits belegt, dass dieses Wort der Regelzahl entspricht. Zwei Stellen
      # mit derselben Tabelle waeren genau das, was hier auseinanderlaeuft.
      #
      # Ein fehlgeschlagener API-Aufruf ist ein FEHLER, kein Skip (`curl -f`,
      # kein `|| true`): Ein Check, der bei einem Netzproblem gruen durchlaeuft,
      # meldet «bestanden», wo «nicht gelaufen» richtig waere — OPS-005.
      - name: GitHub description names the current rule count
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUTF8: "1"
        run: |
          curl -sS -f \
               -H "Authorization: Bearer $GH_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY" \
               > "$RUNNER_TEMP/repo.json"
          python - <<'PY'
          import json, os, pathlib, re, sys

          patterns = pathlib.Path("reference/patterns.py").read_text(encoding="utf-8")
          m = re.search(r"patterns for the (?P<word>\w+) [\w-]+ rules", patterns)
          if not m:
              sys.exit("reference/patterns.py: number word gone — the step above "
                       "should have caught this first; without it there is nothing "
                       "to compare the description against")
          word = m.group("word")

          repo = json.loads(
              pathlib.Path(os.environ["RUNNER_TEMP"], "repo.json").read_text(encoding="utf-8")
          )
          description = repo.get("description") or ""

          found = re.search(r"(?P<word>\w+) transport-hardening rules", description)
          if not found:
              sys.exit(
                  "GitHub description does not carry the phrase '<word> "
                  f"transport-hardening rules' — got {description!r}.\n"
                  "  Either it was reworded (then adjust this anchor in the same "
                  "commit) or the count was dropped from it. An anchor that is "
                  "gone makes this check stop checking without saying so."
              )
          if found.group("word") != word:
              sys.exit(
                  f"GitHub description says {found.group('word')!r} rules, the repo "
                  f"has {word!r}.\n"
                  "  The description lives outside the repository, so no commit "
                  "fixes it — set it on the repo itself:\n"
                  f"    gh repo edit {os.environ['GITHUB_REPOSITORY']} "
                  f'--description "..."'
              )
          print(f"ok — GitHub description says {found.group('word')}, matching the repo")
          PY
