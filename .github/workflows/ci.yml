name: validate

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Die Gates selbst stehen unter `tools/checks/`, dieser Job ruft sie auf.
      # Keine zweite Kopie: Zwei Kopien driften, und ein gedrifteter
      # Pre-Flight-Check ist schlimmer als keiner — er meldet grün auf einem
      # Baum, den dieser Job ablehnt.
      #
      # Das schliesst `ruff check` und `ruff format --check` ein. Sie standen
      # bis 1.7.0 als eigene Schritte hier und liefen deshalb NICHT in
      # `scripts/validate.sh`; genau die Bruchstelle, die der Rest dieser Datei
      # zu vermeiden versucht. Sie sind jetzt Check 13 und 14.
      #
      # Ruff gepinnt, damit ein Upstream-Release weder Formatter noch Regelsatz
      # ändert und die CI an unberührtem Code rot wird — zu einem Zeitpunkt,
      # den niemand gewählt hat. Bewusst anheben.
      #
      # ACHTUNG: diese Version und die `rev` in .pre-commit-config.yaml müssen
      # übereinstimmen — Check 16 prüft es, samt der Frage, ob beide Hooks
      # noch da sind.
      #
      # Check 16 vergleicht dabei zwei TEXTE. Dass die ruff, die gleich läuft,
      # auch diese Version trägt, prüft er nicht — genau deshalb gibt es
      # Check 18. Hier oben ist der Fall harmlos, der Runner ist frisch; auf
      # einem Arbeitsrechner mit einer älteren ruff weiter vorne im PATH ist er
      # es nicht: `scripts/validate.sh` meldete dann grün auf einem Baum, den
      # dieser Job ablehnt. Gemessen genau so, mit ruff 0.15.8 vor 0.16.1.
      - name: Ruff installieren
        run: pip install ruff==0.16.1

      # Die Vorlagen-Abhängigkeiten braucht Check 3, der die Vorlagen wirklich
      # importiert statt sie nur zu kompilieren. Ohne diese Pakete meldet er
      # «FAIL», nicht «skip» — die Begründung steht in
      # requirements-reference.txt.
      - name: Abhängigkeiten installieren
        run: pip install -r requirements-reference.txt -r requirements-dev.txt

      - name: Run the validation suite
        run: bash scripts/validate.sh

      # Die Prüfungen prüfen das Repository. Diese Suite prüft die Prüfungen:
      # Zu jeder gibt es mindestens einen Baum, auf dem sie rot werden MUSS,
      # und der Text ihres Befundes ist zugesichert. `tests/mutations.py` sagt,
      # warum das nötig ist — die Kurzfassung steht in ruff.toml, wo einmal
      # `select = []` stand und beide Ruff-Schritte zwei Wochen lang «All
      # checks passed!» meldeten.
      #
      # Nach validate.sh, nicht davor: Ein echter Befund über das Repository
      # soll zuerst im lesbaren Format des Runners erscheinen, nicht als
      # Testfehlschlag.
      - name: Die Prüfungen selbst testen
        run: pytest

      # Die GitHub-Description steht ausserhalb des Repositories und fällt
      # damit durch jede Prüfung, die Dateien liest — auch durch
      # scripts/validate.sh, das offline und ohne Token laufen können muss.
      # Deshalb ist Check 15 als einziger `offline=False` und läuft nur hier.
      #
      # Zugesagt sind die KERNSCHRITTE (1-3); Schritt 4 und 5 sind Übergabe
      # und zählen nicht mit. Welcher Schritt was ist, steht als [Kern] bzw.
      # [Übergabe] an der jeweiligen Überschrift in SKILL.md.
      #
      # Kein zweiter Ort für die Wahrheit: Verglichen wird gegen die Ziffer aus
      # dem Frontmatter von SKILL.md, und Check 11 im Lauf oben hat bereits
      # belegt, dass diese Ziffer der Zahl der [Kern]-Schritte entspricht.
      #
      # Ein fehlgeschlagener API-Aufruf ist ein FEHLER, kein Skip (`curl -f`,
      # kein `|| true`): Eine Prüfung, die bei einem Netzproblem grün
      # durchläuft, meldet «bestanden», wo «nicht gelaufen» richtig wäre.
      - name: GitHub description names the current core-step count
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUTF8: "1"
        run: |
          curl -sS -f \
               -H "Authorization: Bearer $GH_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY" \
               > "$RUNNER_TEMP/repo.json"
          GITHUB_REPO_JSON="$RUNNER_TEMP/repo.json" \
            python -m tools.checks --include-network 15
