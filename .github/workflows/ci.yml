name: validate

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python references are syntactically valid
        run: |
          if [ -d reference ]; then
            python -m compileall -q reference/
            echo "ok — reference/ compiles"
          else
            echo "skipped — no reference/ directory yet"
          fi

      # Nur Formatierung, kein `ruff check` — Begruendung in ruff.toml.
      # Ruff gepinnt, damit ein Upstream-Release den Formatter nicht aendert
      # und die CI an unberuehrtem Vorlagen-Code rot wird. Bewusst anheben.
      #
      # ACHTUNG: diese Version und die `rev` in .pre-commit-config.yaml
      # muessen uebereinstimmen — der Schritt darunter prueft es.
      - name: Ruff installieren
        run: pip install ruff==0.15.8

      - name: Formatierung der Referenz-Vorlagen
        run: ruff format --check .

      # Der Ruff-Pin steht zweimal: oben und als `rev` im Pre-Commit-Hook.
      # Laufen sie auseinander, formatiert der Hook nach der einen und dieser
      # Job prueft nach der anderen Version — der Hook meldet gruen und die CI
      # wird rot. Ein fehlender Pin ist ebenfalls ein Fehler: dann hat der
      # Vergleich nicht stattgefunden.
      #
      # Reine Shell statt eines Python-Skripts: in einem Repo, dessen einziger
      # Python-Code Vorlagen sind, waere ein eigenes Modul samt Tests
      # unverhaeltnismaessig.
      - name: Ruff-Pin-Sync (ci.yml ↔ .pre-commit-config.yaml)
        run: |
          ci=$(sed -n 's/.*ruff==\([0-9][^ "'"'"']*\).*/\1/p' .github/workflows/ci.yml | head -1)
          hook=$(sed -n '/ruff-pre-commit/,/hooks:/{s/^[[:space:]]*rev:[[:space:]]*v\{0,1\}\([0-9][^[:space:]]*\)[[:space:]]*$/\1/p;}' .pre-commit-config.yaml | head -1)
          if [ -z "$ci" ]; then
            echo "::error::.github/workflows/ci.yml nennt kein ruff==<version>."; exit 1
          fi
          if [ -z "$hook" ]; then
            echo "::error::.pre-commit-config.yaml nennt keine rev fuer ruff-pre-commit."; exit 1
          fi
          if [ "$ci" != "$hook" ]; then
            echo "::error::Ruff-Pins laufen auseinander — ci.yml $ci, Hook $hook. Beide im selben Commit bumpen."; exit 1
          fi
          echo "Ruff-Pin OK ($ci; beide Stellen stimmen ueberein)."

      - name: SKILL.md carries a well-formed frontmatter
        env:
          PYTHONUTF8: "1"
        run: |
          python - <<'PY'
          import pathlib, re, sys
          p = pathlib.Path("SKILL.md")
          m = re.match(r"^---\nname: (.+?)\ndescription: (.+?)\n---\n",
                       p.read_text(encoding="utf-8"), re.S)
          if not m:
              sys.exit("SKILL.md: frontmatter missing or malformed")
          name, desc = m.group(1).strip(), m.group(2).strip()
          if name != "mcp-transport-hardening":
              sys.exit(f"SKILL.md: expected name 'mcp-transport-hardening', got {name!r}")
          if len(desc) > 1024:
              sys.exit(f"SKILL.md: description too long ({len(desc)} > 1024)")
          print(f"ok — name={name}, description={len(desc)} chars")
          PY

      - name: Every rule carries a counter-example pair and a Nachweis
        env:
          PYTHONUTF8: "1"
        run: |
          python - <<'PY'
          import pathlib, re, sys

          skill = pathlib.Path("SKILL.md").read_text(encoding="utf-8")
          sections = re.split(r"^## (?=Regel )", skill, flags=re.M)[1:]
          if not sections:
              sys.exit("SKILL.md: no '## Regel N' sections found")

          numbers = [int(re.match(r"Regel (\d+)", s).group(1)) for s in sections]
          if numbers != list(range(1, len(numbers) + 1)):
              sys.exit(f"SKILL.md: rule numbers not sequential: {numbers}")

          for section in sections:
              title = section.splitlines()[0]
              body = section.split("\n## ")[0]
              if "# ✗" not in body or "# ✓" not in body:
                  sys.exit(f"{title}: missing the counter-example / example code pair")
              if "**Nachweis:**" not in body:
                  sys.exit(f"{title}: missing the Nachweis sentence")
              print(f"ok — {title[:60]}")
          print(f"ok — {len(sections)} rules, each with a code pair and a Nachweis")
          PY

      - name: Rule count is consistent across SKILL.md, both READMEs and patterns.py
        env:
          PYTHONUTF8: "1"
        run: |
          python - <<'PY'
          import pathlib, re, sys

          skill = pathlib.Path("SKILL.md").read_text(encoding="utf-8")
          expected = len(re.findall(r"^## Regel \d+", skill, re.M))

          def listed(path, heading):
              text = pathlib.Path(path).read_text(encoding="utf-8")
              m = re.search(rf"^## {heading}\n(.*?)(?=^## )", text, re.M | re.S)
              if not m:
                  sys.exit(f"{path}: section '## {heading}' not found")
              return len(re.findall(r"^\d+\. ", m.group(1), re.M))

          for path, heading in [("README.md", "The twelve rules"),
                                ("README.de.md", "Die zwölf Regeln")]:
              got = listed(path, heading)
              if got != expected:
                  sys.exit(f"{path}: lists {got} rules, SKILL.md defines {expected}")
              print(f"ok — {path}: {got} rules")

          # reference/patterns.py makes two claims nothing else checks: the number
          # word in its module docstring, and that every rule actually appears in
          # it. Both were correct when written — which is exactly how a sibling
          # repository went on describing "five rules" for two weeks after the
          # sixth was added.
          # Bis "fifteen", damit die naechsten Regeln den Wortschatz nicht
          # sprengen: ein Zahlwort, das hier fehlt, ergibt `None` und meldet
          # dieselbe Meldung wie ein echter Zahlendreher — der Befund zeigte
          # dann auf die falsche Datei.
          WORDS = {"one": 1, "two": 2, "three": 3, "four": 4, "five": 5,
                   "six": 6, "seven": 7, "eight": 8, "nine": 9, "ten": 10,
                   "eleven": 11, "twelve": 12, "thirteen": 13, "fourteen": 14,
                   "fifteen": 15}
          patterns = pathlib.Path("reference/patterns.py").read_text(encoding="utf-8")

          m = re.search(r"patterns for the (?P<word>\w+) [\w-]+ rules", patterns)
          if not m:
              sys.exit("reference/patterns.py: the phrase 'patterns for the <word> "
                       "... rules' is gone — anchor removed or reworded, so this "
                       "check would silently stop checking")
          if m.group("word") not in WORDS:
              sys.exit(f"reference/patterns.py: docstring says "
                       f"{m.group('word')!r}, which is not a number word this "
                       "check knows — extend WORDS in ci.yml, otherwise the "
                       "comparison below reports a mismatch that is really a "
                       "gap in this script")
          claimed = WORDS[m.group("word")]
          if claimed != expected:
              sys.exit(f"reference/patterns.py: docstring says {m.group('word')!r} "
                       f"rules, SKILL.md defines {expected}")

          # «Rule 4», «Rules 2 + 3», «Rules 5-7», «rule 1(c)» — ranges expanded.
          mentioned = set()
          for mm in re.finditer(r"[Rr]ules?\s+(\d+(?:\s*(?:[-–+,]|and)\s*\d+)*)", patterns):
              nums = [int(n) for n in re.findall(r"\d+", mm.group(1))]
              if re.search(r"[-–]", mm.group(1)) and len(nums) == 2:
                  mentioned.update(range(nums[0], nums[1] + 1))
              else:
                  mentioned.update(nums)
          missing = sorted(set(range(1, expected + 1)) - mentioned)
          if missing:
              sys.exit(f"reference/patterns.py: nothing for rule(s) {missing} — "
                       "a rule without a pattern is a rule nobody can copy")
          print(f"ok — reference/patterns.py: says {m.group('word')}, covers "
                f"{sorted(mentioned)}")

          print(f"ok — {expected} rules, consistent everywhere")
          PY

      - name: Referenced files exist
        run: |
          for f in SKILL.md reference/patterns.py README.md README.de.md \
                   LICENSE CHANGELOG.md; do
            test -f "$f" || { echo "missing: $f"; exit 1; }
          done
          echo "ok — all referenced files present"

      # The five repositories of the chain are named together in exactly one
      # place per language. Nothing outside this repo can be tested from here —
      # the GitHub topic itself is checked by the guard in mcp-audit-skill,
      # which is the only repo carrying the manifest. What CAN be tested is
      # that the table has not quietly lost a member.
      - name: The quality-chain table names all five members
        env:
          PYTHONUTF8: "1"
        run: |
          python - <<'PY'
          import pathlib, re, sys

          MEMBERS = [
              "mcp-data-source-probe-skill",
              "mcp-data-fidelity-skill",
              "mcp-transport-hardening-skill",
              "mcp-audit-skill",
              "mcp-continuous-auditor",
          ]
          TOPIC_URL = "https://github.com/topics/mcp-quality-chain"

          for path, heading in [("README.md", "The MCP quality chain"),
                                ("README.de.md", "Die MCP-Qualitätskette")]:
              text = pathlib.Path(path).read_text(encoding="utf-8")
              m = re.search(rf"^### {re.escape(heading)}\n(.*?)(?=^#{{2,3}} |\Z)",
                            text, re.M | re.S)
              if not m:
                  sys.exit(f"{path}: section '### {heading}' not found — anchor gone "
                           "or reworded, so this check would silently stop checking")
              body = m.group(1)
              missing = [r for r in MEMBERS if r not in body]
              if missing:
                  sys.exit(f"{path}: the chain table does not name {missing}")
              if TOPIC_URL not in body:
                  sys.exit(f"{path}: the shared topic page {TOPIC_URL} is not linked — "
                           "without it the table is a list nobody outside can find")
              print(f"ok — {path}: all {len(MEMBERS)} members named, topic page linked")
          PY

      - name: No compiled Python is tracked
        run: |
          if git ls-files | grep -E '(__pycache__/|\.py[cod]$)'; then
            echo "compiled Python is tracked — see .gitignore"
            exit 1
          fi
          echo "ok — no compiled Python tracked"

      - name: Version badge matches the latest CHANGELOG release
        env:
          PYTHONUTF8: "1"
        run: |
          python - <<'PY'
          import pathlib, re, sys

          # Quelle ist die oberste Release-Überschrift. `[Unreleased]` trägt keine
          # Versionsnummer und wird vom Muster von selbst übersprungen.
          lines = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          HEADING = re.compile(r"^## \[v?(?P<version>\d+\.\d+\.\d+)\]")
          source = next(((n, ln, m.group("version"))
                         for n, ln in enumerate(lines, 1)
                         if (m := HEADING.match(ln))), None)
          if source is None:
              sys.exit("CHANGELOG.md: no '## [X.Y.Z]' release heading found — anchor "
                       "gone, so this check would have nothing to compare against")
          lineno, heading, expected = source

          # Über das Dateisystem, nicht als gepflegte Liste: eine dritte
          # Sprachfassung ist damit automatisch abgedeckt.
          readmes = sorted(pathlib.Path(".").glob("README*.md"))
          if not readmes:
              sys.exit("no README*.md found — nothing to check, which would pass silently")

          BADGE = re.compile(r"badge/version-(\d+\.\d+\.\d+)-")
          for path in readmes:
              found = BADGE.findall(path.read_text(encoding="utf-8"))
              if not found:
                  sys.exit(f"{path}: no version badge found — anchor gone or reworded, "
                           "so this check would stop checking this file")
              stale = sorted({v for v in found if v != expected})
              if stale:
                  sys.exit(
                      f"{path}: version badge shows {stale}, but the topmost release in "
                      f"CHANGELOG.md is {expected} (line {lineno}: {heading.strip()!r}).\n"
                      "  Either the badge was not bumped with the release, or a release "
                      "heading was lost — check which side moved before editing."
                  )
              print(f"ok — {path}: {expected}")
          print(f"ok — version badge matches CHANGELOG ({expected}, line {lineno}) "
                f"in {len(readmes)} file(s)")
          PY
