# Misst, ob reference/patterns.py noch zur AKTUELLEN SDK-Oberflaeche passt.
#
# WARUM DAS NICHT INS PR-GATE GEHOERT. Die CI installiert `mcp==2.0.0`, und
# der Pin ist Absicht: Ohne ihn faerbte ein fremdes Release die CI an
# unberuehrtem Vorlagen-Code rot — dieselbe Begruendung wie beim ruff-Pin.
#
# Der Preis davon stand bisher nur im Kommentar: Verschiebt upstream die
# Oberflaeche in 2.1, bleibt der Import-Smoke-Test gruen und die Vorlage
# veraltet STILL. Niemand erfaehrt es, bis jemand den Pin von Hand hebt.
#
# Dieser Lauf loest den Preis ein, ohne den Pin aufzugeben: Er faehrt woechentlich
# gegen die JEWEILS NEUESTE mcp und meldet, wenn die Vorlage dort nicht mehr
# importiert. Das PR-Gate bleibt gepinnt und reproduzierbar; die Drift wird
# trotzdem sichtbar. Ein rotes Ergebnis hier ist kein Grund, einen PR zu
# blockieren — es ist die Aufforderung, den Pin bewusst zu heben.
name: sdk-drift

on:
  schedule:
    # Woechentlich, montags. Nicht taeglich: Die Frage aendert sich langsam,
    # und ein Lauf, der meistens dasselbe sagt, wird nicht mehr gelesen.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # UNGEPINNT — das ist der ganze Zweck dieses Laufs. Ein fehlgeschlagener
      # Install ist ein FEHLER, kein Skip: «nicht gelaufen» als «bestanden» zu
      # melden waere hier besonders teuer, weil dieser Lauf die einzige Stelle
      # ist, die ueberhaupt nach der Drift schaut.
      - name: Neueste mcp installieren
        run: pip install --upgrade mcp pytest

      - name: Gepinnte gegen aufgeloeste Version melden
        run: |
          pinned=$(sed -n 's/.*mcp==\([0-9][^ ]*\).*/\1/p' .github/workflows/ci.yml | head -1)
          if [ -z "$pinned" ]; then
            echo "::error::ci.yml nennt kein mcp==<version> — Anker weg. Ohne ihn hat dieser Lauf nichts, wogegen er die aufgeloeste Version haelt."; exit 1
          fi
          latest=$(python -c "import importlib.metadata as m; print(m.version('mcp'))")
          echo "gepinnt in ci.yml : $pinned"
          echo "gerade aufgeloest : $latest"
          {
            echo "| | Version |"
            echo "|---|---|"
            echo "| gepinnt in \`ci.yml\` | \`$pinned\` |"
            echo "| aktuell auf PyPI | \`$latest\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$pinned" = "$latest" ]; then
            echo "Keine Drift — der Pin ist die aktuelle Version." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Der Pin liegt hinter PyPI. Der Schritt darunter sagt, ob das die Vorlage betrifft." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      # Derselbe Import wie im PR-Gate, nur gegen die neueste SDK. Faellt er,
      # ist die Vorlage veraltet — und zwar nachweisbar, nicht vermutet.
      - name: reference/patterns.py gegen die neueste SDK importieren
        env:
          PYTHONPATH: reference
          PYTHONUTF8: "1"
        run: |
          python -c "import patterns; print('ok — Vorlage importiert gegen die aktuelle SDK')" || {
            echo "::error::reference/patterns.py importiert NICHT mehr gegen die aktuelle mcp. Die Vorlage beschreibt eine Oberflaeche, die es so nicht mehr gibt — Regel 1 gehoert nachgezogen und der Pin in ci.yml im selben Commit gehoben."
            exit 1
          }
