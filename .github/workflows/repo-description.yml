name: repo-description

# Die Katalog-Zahlen stehen an sechs Orten. Fünf sichert `tests/`; der sechste
# ist die GitHub-Repo-Description und liegt ausserhalb des Repos — deshalb ist
# ausgerechnet sie von 68 auf 85 Checks auseinandergelaufen, ohne dass etwas
# anschlug.
#
# Bewusst NICHT bei `pull_request`: Ein PR, der den Katalog wachsen lässt,
# macht die Description im selben Moment veraltet, und korrigieren kann sie nur
# ein Mensch in den Repo-Settings — nach dem Merge. Ein PR-Gate würde das
# falsche Ereignis bestrafen und wäre nach zwei Wochen abgeschaltet.
#
# Stattdessen: nach dem Merge auf `main`, wöchentlich als Netz für alles, was
# ausserhalb dieses Repos an der Description dreht, und von Hand auslösbar.

on:
  push:
    branches: [main]
    paths:
      - "checks/**"
      - "tools/check_repo_description.py"
      - ".github/workflows/repo-description.yml"
  schedule:
    # Montags 06:23 UTC. Ungerade Minute gegen den Scheduler-Stampede.
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  # Für die Eskalation unten. Ein Guard, der nur auf `main` rot wird, meldet an
  # niemanden: `repo-description` war über sechs aufeinanderfolgende Merges rot
  # und wurde nie beantwortet, weil ein roter Push-Lauf in keinem PR auftaucht.
  # Ein Befund braucht einen Adressaten, sonst ist er Dekoration.
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Description gegen den Katalog prüfen
        id: check
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
          # Für das Lesen öffentlicher Repo-Metadaten nicht nötig, aber es hebt
          # das Rate-Limit von 60/h auf 1000/h.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python tools/check_repo_description.py \
            --repo "${{ github.repository }}" \
            --format json > result.json || echo "failed=true" >> "$GITHUB_OUTPUT"
          cat result.json

      - name: Befund in die Job-Summary schreiben
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          p = pathlib.Path("result.json")
          if not p.exists() or not p.read_text().strip():
              print("## Repo-Description\n\nKein Ergebnis — siehe Log des vorigen Schritts.")
              raise SystemExit(0)
          r = json.loads(p.read_text(encoding="utf-8"))
          if r.get("ok"):
              print(f"## Repo-Description OK\n\n{r['catalog_checks']} Checks, "
                    f"{r['catalog_categories']} Kategorien — Description stimmt.")
          elif r.get("description") is None:
              print("## Repo-Description — nicht geprüft\n")
              print(f"`{r.get('status')}`\n")
              print("Der Vergleich hat nicht stattgefunden. Das ist kein Bestehen.")
          else:
              print("## Repo-Description veraltet\n")
              for problem in r["problems"]:
                  print(f"- {problem}")
              print("\n**Korrigierter Text** (Formulierung unverändert, nur die Zahlen):\n")
              print("```")
              print(r["suggestion"])
              print("```")
              print(f"\nEintragen auf der [Repo-Startseite]"
                    f"(https://github.com/{r['repo']}) — rechte Spalte **About**, "
                    "Zahnrad-Symbol. *Nicht* in den Settings: die Description steht "
                    "dort nicht.\n\nDer Guard schreibt bewusst nicht — Repo-Metadaten "
                    "zu ändern gehört einem Menschen.")
          PY

      # Die Job-Summary sieht nur, wer den Lauf öffnet — und einen Push-Lauf auf
      # `main` öffnet niemand. Deshalb bekommt der Befund hier einen Adressaten:
      # ein Issue, das bei Drift entsteht oder aktualisiert wird und sich selbst
      # schliesst, sobald die Description wieder stimmt. Ohne das Schliessen
      # wäre es Dauergemecker und würde nach zwei Wochen ignoriert.
      - name: Befund eskalieren oder erledigen
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: "Repo-Description weicht vom Katalog ab"
        run: |
          set -euo pipefail

          # Drei Zustände, nicht zwei. Ein leerer Body hiesse sonst «alles gut»
          # — auch dann, wenn der Vergleich gar nicht stattgefunden hat, weil
          # `result.json` fehlt oder die Description nicht geholt werden konnte.
          # Ein nicht gelaufener Check ist kein Bestehen (§2.6), und ein Issue
          # auf dieser Grundlage zu schliessen wäre eine stille Entwarnung.
          state=$(python tools/render_description_issue.py \
                    --result result.json --out issue-body.md)
          echo "Zustand: $state"

          # `--limit` explizit: der Default von 30 würde das eigene Issue
          # übersehen, sobald mehr offen sind, und bei jedem Lauf ein neues
          # anlegen. Ein Guard, der sich selbst dupliziert, wird stummgeschaltet.
          existing=$(gh issue list --state open --limit 200 --json number,title \
            --jq '[.[] | select(.title == env.ISSUE_TITLE)] | .[0].number // empty')

          case "$state" in
            drift)
              if [ -n "$existing" ]; then
                gh issue edit "$existing" --body-file issue-body.md
                echo "Issue #$existing aktualisiert."
              else
                gh issue create --title "$ISSUE_TITLE" --body-file issue-body.md
              fi
              ;;
            ok)
              if [ -n "$existing" ]; then
                gh issue close "$existing" \
                  --comment "Description stimmt wieder mit dem Katalog überein — automatisch geschlossen."
                echo "Issue #$existing geschlossen."
              fi
              ;;
            unchecked)
              echo "Der Vergleich hat nicht stattgefunden — Issue bleibt, wie es ist."
              ;;
          esac

      - name: Rot, wenn die Description nicht stimmt
        if: steps.check.outputs.failed == 'true'
        run: |
          echo "Description weicht vom Katalog ab oder konnte nicht geholt werden."
          echo "Der fertige Text steht in der Job-Summary und im offenen Issue."
          exit 1
